<html lang="ko">

<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');
:root{--bg:#f5efe5;--ink:#25231f;--muted:#766f64;--card:rgba(255,253,248,.9);--line:rgba(50,42,32,.12);--coral:#e76843;--coral-soft:#f8ddd2;--green:#537765;--green-soft:#dbe8df;--yellow:#efc95e;--shadow:0 22px 65px rgba(74,61,42,.12)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;color:var(--ink);background:radial-gradient(circle at 8% 8%,#efd77c44,transparent 28rem),radial-gradient(circle at 92% 88%,#7296812d,transparent 30rem),var(--bg);font-family:"Noto Sans KR",-apple-system,sans-serif;-webkit-font-smoothing:antialiased}button{font:inherit;color:inherit}button:focus-visible{outline:3px solid #e7684355;outline-offset:3px}.shell{width:min(1380px,100%);margin:auto;padding:28px clamp(18px,4vw,58px) 48px}

.calendar-tools{display:flex;align-items:center;gap:16px}.theme-toggle{width:38px;height:38px;display:grid;place-items:center;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;transition:.2s}.theme-toggle:hover{transform:translateY(-1px);background:#f3eee6}.theme-toggle svg{width:18px;height:18px}.theme-toggle .sun{display:none}html[data-theme="dark"] .theme-toggle .moon{display:none}html[data-theme="dark"] .theme-toggle .sun{display:block}

.side{display:grid;gap:18px}.summary{padding:23px 25px;background:#fff}.summary-top{display:flex;justify-content:space-between;align-items:center}.period{margin:0;font-size:17px;font-weight:700;letter-spacing:-.03em}.summary h2{margin:7px 0 0;color:var(--muted);font-size:13px;font-weight:500}.count{min-width:58px;height:58px;display:grid;place-items:center;padding:0 15px;border-radius:16px;background:var(--coral-soft);color:#983e27;font-size:24px;font-weight:700}.upcoming{padding:22px 25px;background:#fff}.upcoming-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.upcoming-head span{color:var(--muted);font-size:12px;font-weight:700}.d-day{padding:5px 9px;border-radius:999px;background:var(--green-soft);color:#355847;font-size:11px}.upcoming-date{display:block;margin-top:10px;color:var(--ink);font-size:17px;font-weight:700;letter-spacing:-.03em}.next-names{display:grid;gap:7px;margin-top:15px;padding-top:14px;border-top:1px solid var(--line)}.next-item{display:grid;grid-template-columns:8px 1fr auto;align-items:center;gap:9px;min-height:28px}.next-item i{width:8px;height:8px;border-radius:50%;background:var(--coral)}.next-item i.solar{background:var(--green)}.next-item strong{font-size:13px}.next-item small{padding:4px 6px;border-radius:6px;background:var(--coral-soft);color:#983e27;font-size:9px;font-weight:700}.next-item small.solar{background:var(--green-soft);color:#355847}
.list-panel{padding:22px}.list-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}.list-head h2{margin:0;font-size:20px;font-weight:700;letter-spacing:-.03em}.event-list{display:grid;gap:9px;max-height:405px;overflow:auto;scrollbar-width:thin}.event{width:100%;display:grid;grid-template-columns:48px 1fr auto;align-items:center;gap:11px;padding:10px;border:1px solid transparent;border-radius:17px;background:#ffffff9e;text-align:left;cursor:pointer;transition:.2s}.event:hover,.event.selected{border-color:var(--line);background:white;transform:translateX(3px)}.date{width:48px;height:48px;display:grid;place-content:center;border-radius:15px;background:var(--coral-soft);color:#983e27;text-align:center;line-height:1}.solar .date{background:var(--green-soft);color:#355847}.date b{font-size:17px}.date span{margin-top:4px;font-size:8px;font-weight:700}.info strong{display:block;font-size:13px}.info span{display:block;margin-top:5px;color:var(--muted);font-size:10px}.badge{padding:5px 7px;border-radius:999px;background:var(--coral-soft);color:#983e27;font-size:8px;font-weight:700}.solar .badge{background:var(--green-soft);color:#355847}.empty{padding:32px 8px;color:var(--muted);text-align:center;font-size:12px}

8df;box-shadow:inset 0 0 0 3px var(--yellow)}
.toast{position:fixed;top:max(24px,env(safe-area-inset-top));left:50%;z-index:20;display:flex;align-items:center;gap:12px;min-width:260px;max-width:min(520px,calc(100% - 28px));padding:12px 18px 12px 12px;border-radius:18px;background:var(--ink);color:white;box-shadow:0 15px 40px #0004;transform:translate(-50%,-160%);opacity:0;transition:.4s cubic-bezier(.2,.8,.2,1);pointer-events:none}.toast.show{transform:translate(-50%,0);opacity:1}.toast-icon{width:35px;height:35px;display:grid;place-items:center;flex:0 0 auto;border-radius:12px;background:var(--yellow);color:var(--ink)}.toast-icon.memorial{background:#e9e5df;color:#514d47}.toast-icon.mixed{background:#e8e3da;color:#655f56}.toast-icon svg{width:19px;height:19px}.toast strong{display:block;font-size:12px;line-height:1.5}.toast span{display:block;margin-top:3px;color:#ffffff99;font-size:9px}.confetti{position:fixed;inset:0;z-index:15;overflow:hidden;pointer-events:none}.confetti i{position:absolute;top:-20px;width:8px;height:14px;border-radius:2px;animation:fall var(--duration) linear forwards}@keyframes fall{to{transform:translate3d(var(--drift),110vh,0) rotate(760deg)}}

@media(max-width:650px){.shell{padding:14px 10px 34px}.panel{border-radius:22px}.calendar{padding:14px 8px 16px}.calendar-head{padding:0 5px;gap:6px}.calendar-tools{gap:0}.legend{display:none}.month-nav{flex:1;justify-content:space-between}.day{min-height:68px;padding:40px 4px 5px;text-align:left}.num{top:6px;left:4px}.dots{margin:0 0 0 5px}.label{display:none}.side{grid-template-columns:1fr}.summary{padding:23px}.list-panel{padding:18px 14px}.event-list{max-height:none}.toast{width:calc(100% - 28px)}}
html[data-theme="dark"]{color-scheme:dark;--bg:#171816;--ink:#efede7;--muted:#aaa59b;--card:rgba(34,35,32,.94);--line:rgba(255,255,255,.12);--coral:#ef8465;--coral-soft:#4c3028;--green:#7fa68e;--green-soft:#293e33;--yellow:#d5b44e;--shadow:0 22px 65px rgba(0,0,0,.3)}html[data-theme="dark"] body{background:radial-gradient(circle at 8% 8%,#7c69312e,transparent 28rem),radial-gradient(circle at 92% 88%,#355c4529,transparent 30rem),var(--bg)}html[data-theme="dark"] .panel{border-color:#ffffff12}html[data-theme="dark"] .summary,html[data-theme="dark"] .upcoming,html[data-theme="dark"] .event,html[data-theme="dark"] .view-all,html[data-theme="dark"] .theme-toggle,html[data-theme="dark"] .modal-close,html[data-theme="dark"] .all-event{background:#252622}html[data-theme="dark"] .event:hover,html[data-theme="dark"] .event.selected,html[data-theme="dark"] .all-event:hover{background:#2c2d29}html[data-theme="dark"] .week,html[data-theme="dark"] .days{border-color:#ffffff17}html[data-theme="dark"] .week span,html[data-theme="dark"] .day{border-color:#ffffff17}html[data-theme="dark"] .day.blank{background:#1d1e1b}html[data-theme="dark"] .day.has:hover{background:#2b2c28;box-shadow:inset 0 0 0 2px #795243}html[data-theme="dark"] .day.current .num{background:#ded8cd;color:#24231f}html[data-theme="dark"] .label{color:#ffb49e}html[data-theme="dark"] .label.solar{color:#b5dec5}html[data-theme="dark"] .count{color:#f4ae97}html[data-theme="dark"] .d-day{background:#304c3d;color:#c3ead1}html[data-theme="dark"] .date{color:#ffb49e}html[data-theme="dark"] .solar .date{color:#b5dec5}html[data-theme="dark"] .info strong{color:#f2efe9}html[data-theme="dark"] .info span{color:#bbb5ab}html[data-theme="dark"] .next-item strong{color:#f2efe9}html[data-theme="dark"] .next-item small,html[data-theme="dark"] .badge{color:#f4ae97}html[data-theme="dark"] .next-item small.solar,html[data-theme="dark"] .solar .badge,html[data-theme="dark"] .all-event.solar .badge{color:#a9d2b9}html[data-theme="dark"] .toast{background:#0e0f0d;color:#fff;border:1px solid #ffffff1f}html[data-theme="dark"] .toast strong{color:#fff}html[data-theme="dark"] .toast span{color:#d1cdc5}html[data-theme="dark"] .toast-icon{background:#d5b44e;color:#171816}html[data-theme="dark"] .toast-icon.memorial{background:#383936;color:#e4e1da}html[data-theme="dark"] .toast-icon.mixed{background:#383936;color:#d0ccc4}html[data-theme="dark"] .modal{border-color:#ffffff17;background:#1e1f1c}html[data-theme="dark"] .all-event{border-color:#ffffff12}html[data-theme="dark"] .day.target{background:#4b4327;box-shadow:inset 0 0 0 3px var(--yellow)}

<body>
<main class="shell">
<section class="dashboard">
<section class="panel calendar" aria-label="월간 달력"><div class="calendar-head"><div class="month-nav"><button class="round" id="prevMonth" aria-label="이전 달">‹</button><h2 class="month-title" id="month"></h2><button class="round" id="nextMonth" aria-label="다음 달">›</button></div><div class="calendar-tools"><div class="legend"><span><i></i>음력</span><span><i></i>양력</span></div><button class="theme-toggle" id="themeToggle" aria-label="다크 모드로 전환"><svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5 8.5 8.5 0 1 0 20.5 14.2Z"/></svg><svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"/></svg></button></div></div><div class="week" aria-hidden="true"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div><div class="days" id="days"></div></section>
<aside class="side">
<section class="panel upcoming"><div class="upcoming-head"><span>가장 가까운 기념일</span><strong class="d-day" id="nextDday"></strong></div><time class="upcoming-date" id="nextDate"></time><div class="next-names" id="nextName">확인하고 있어요</div></section>
<section class="panel summary"><div class="summary-top"><div><p class="period" id="summaryLabel"></p><h2>이번 달 일정</h2></div><div class="count" id="count">0</div></div></section>
<section class="panel list-panel"><div class="list-head"><h2>기념일 목록</h2><button class="view-all" id="viewAll">전체 기념일 보기</button></div><div class="event-list" id="eventList" aria-live="polite"></div></section>
</aside></section></main>
<div class="toast" id="toast" role="status" aria-live="polite"><div class="toast-icon" id="toastIcon" aria-hidden="true"></div><div><strong id="toastTitle"></strong><span id="toastDate"></span></div></div><div class="confetti" id="confetti" aria-hidden="true"></div>
<div class="modal-backdrop" id="eventModal" aria-hidden="true"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><header class="modal-head"><div><h2 id="modalTitle">전체 기념일</h2><p id="modalYear"></p></div><button class="modal-close" id="modalClose" aria-label="닫기">×</button></header><div class="all-events" id="allEventList"></div></section></div>
<script>
const EVENTS=[
{type:'celebration',lunar:1,year:1941,month:1,day:12,name:'할머니 생신'},{type:'celebration',lunar:1,year:1944,month:2,day:25,name:'외할아버지 생신'},{type:'celebration',lunar:1,year:1966,month:3,day:23,name:'아빠 생신'},{type:'celebration',lunar:1,year:1951,month:4,day:3,name:'외할머니 생신'},{type:'celebration',lunar:1,year:1973,month:8,day:3,name:'이모 생신'},{type:'celebration',lunar:1,year:1971,month:9,day:4,name:'이모부 생신'},{type:'celebration',lunar:1,year:1971,month:10,day:8,name:'엄마 생신'},{type:'memorial',lunar:1,year:2016,month:11,day:7,name:'할아버지 제사'},{type:'celebration',lunar:1,year:1968,month:11,day:25,name:'삼촌 생신'},{type:'celebration',lunar:1,year:1974,month:12,day:13,name:'외삼촌 생신'},
{type:'celebration',lunar:0,year:2001,month:3,day:26,name:'김유신 생일'},{type:'celebration',lunar:0,year:1996,month:5,day:23,name:'박철오 생일'},{type:'celebration',lunar:0,year:2005,month:8,day:11,name:'김유진 생일'},{type:'celebration',lunar:0,year:2005,month:10,day:7,name:'강준영 생일'},{type:'celebration',lunar:0,year:1993,month:10,day:27,name:'박한솔 생일'}];
const $=id=>document.getElementById(id),now=new Date(),pad=n=>String(n).padStart(2,'0');
let viewYear=now.getFullYear(),viewMonth=now.getMonth(),resolved=[],toastTimer;
const lunarFormatter=new Intl.DateTimeFormat('ko-KR-u-ca-dangi',{month:'numeric',day:'numeric'});
function lunarParts(date){const p=lunarFormatter.formatToParts(date),m=p.find(x=>x.type==='month')?.value||'',d=p.find(x=>x.type==='day')?.value||'';return{month:+m.replace(/\D/g,''),day:+d.replace(/\D/g,''),leap:m.includes('윤')}}
function resolveYear(year){const lookup=new Map(),date=new Date(year,0,1,12);while(date.getFullYear()===year){const l=lunarParts(date);if(!l.leap)lookup.set(l.month+'-'+l.day,{month:date.getMonth()+1,day:date.getDate()});date.setDate(date.getDate()+1)}return EVENTS.map((e,index)=>{const s=e.lunar?lookup.get(e.month+'-'+e.day):{month:e.month,day:e.day};return{...e,index,solarMonth:s?.month||e.month,solarDay:s?.day||e.day}}).sort((a,b)=>a.solarMonth-b.solarMonth||a.solarDay-b.solarDay)}
function setYear(y){viewYear=y;resolved=resolveYear(y);render()}
function render(){$('month').textContent=viewYear+'년 '+(viewMonth+1)+'월';$('summaryLabel').textContent=viewYear+'년 '+(viewMonth+1)+'월';renderCalendar();renderList();renderSummary()}
function renderCalendar(){const root=$('days');root.textContent='';const first=new Date(viewYear,viewMonth,1).getDay(),last=new Date(viewYear,viewMonth+1,0).getDate();for(let i=0;i<first;i++)root.append(makeDay('',[],'blank'));for(let day=1;day<=last;day++){const date=new Date(viewYear,viewMonth,day),events=resolved.filter(e=>e.solarMonth===viewMonth+1&&e.solarDay===day),cls=[date.getDay()===0?'sun':'',date.getDay()===6?'sat':'',sameDate(date,now)?'current':''].join(' ');root.append(makeDay(day,events,cls))}while(root.children.length%7)root.append(makeDay('',[],'blank'))}
function makeDay(day,events,cls){const b=document.createElement('button');b.type='button';b.className='day '+cls+(events.length?' has':'');if(!day){b.tabIndex=-1;return b}b.dataset.day=day;b.innerHTML='<span class="num">'+day+'</span>';if(events.length){b.setAttribute('aria-label',(viewMonth+1)+'월 '+day+'일, '+events.map(e=>e.name).join(', '));const dots=document.createElement('div');dots.className='dots';events.forEach(e=>dots.insertAdjacentHTML('beforeend','<i class="dot '+(e.lunar?'':'solar')+'"></i>'));b.append(dots);const e=events[0];b.insertAdjacentHTML('beforeend','<p class="label '+(e.lunar?'':'solar')+'">'+e.name+(events.length>1?' 외 '+(events.length-1):'')+'</p>');b.onclick=()=>showEvents(events)}else b.tabIndex=-1;return b}
function renderList(){const root=$('eventList');root.textContent='';const items=resolved.filter(e=>e.solarMonth===viewMonth+1);if(!items.length){root.innerHTML='<div class="empty">이 달에는 기념일이 없어요.</div>';return}items.forEach(e=>{const b=document.createElement('button'),yearText=e.year+'년'+(e.type==='celebration'?'생':'');b.type='button';b.className='event '+(e.lunar?'':'solar');b.innerHTML='<span class="date"><b>'+pad(e.solarDay)+'</b><span>'+(viewMonth+1)+'월</span></span><span class="info"><strong>'+e.name+'</strong><span>'+(e.lunar?'음력 '+e.month+'월 '+e.day+'일 · '+yearText:yearText+' '+e.month+'월 '+e.day+'일')+'</span></span><span class="badge">'+(e.lunar?'음력':'양력')+'</span>';b.onclick=()=>{showEvent(e);goToEvent(e,false)};root.append(b)})}
function renderSummary(){const monthEvents=resolved.filter(e=>e.solarMonth===viewMonth+1);$('count').textContent=monthEvents.length;const todayStart=new Date(now.getFullYear(),now.getMonth(),now.getDate());let candidates=resolved.map(e=>({...e,date:new Date(viewYear,e.solarMonth-1,e.solarDay)})).filter(e=>e.date>=todayStart);if(!candidates.length)candidates=resolveYear(viewYear+1).map(e=>({...e,date:new Date(viewYear+1,e.solarMonth-1,e.solarDay)}));const next=candidates[0],sameDay=candidates.filter(e=>e.date.getTime()===next.date.getTime()),diff=Math.ceil((next.date-todayStart)/864e5);$('nextDate').textContent=next.date.getFullYear()+'년 '+next.solarMonth+'월 '+next.solarDay+'일';$('nextDday').textContent=diff===0?'오늘':diff>0?'D-'+diff:'지난 일정';const root=$('nextName');root.textContent='';sameDay.forEach(e=>{const item=document.createElement('div');item.className='next-item';item.innerHTML='<i class="'+(e.lunar?'':'solar')+'"></i><strong>'+e.name+'</strong><small class="'+(e.lunar?'lunar':'solar')+'">'+(e.lunar?'음력':'양력')+'</small>';root.append(item)})}
function setToastIcon(type){const icon=$('toastIcon');icon.className='toast-icon '+type;icon.innerHTML=type==='celebration'?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 12v9H4v-9M2 8h20v4H2zM12 8v13M12 8H7.5A2.5 2.5 0 1 1 10 5.5C10 8 12 8 12 8Zm0 0h4.5A2.5 2.5 0 1 0 14 5.5C14 8 12 8 12 8Z"/></svg>':type==='memorial'?'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5c-2.8 0-4.7 2-4.7 4.7 0 1.8 1 3.6 2.2 5.2L5.8 21.5h3.4l2.8-6.7 2.8 6.7h3.4l-3.7-9.1c1.2-1.6 2.2-3.4 2.2-5.2 0-2.7-1.9-4.7-4.7-4.7Zm0 2.7c1.2 0 2 .8 2 2 0 .9-.5 1.9-2 4.1-1.5-2.2-2-3.2-2-4.1 0-1.2.8-2 2-2Z"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>'}
function showEvent(e){setToastIcon(e.type);$('toastTitle').textContent=e.name;$('toastDate').textContent=viewYear+'년 '+e.solarMonth+'월 '+e.solarDay+'일 · '+(e.lunar?'음력 '+e.month+'월 '+e.day+'일':'양력');$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),2600);if(e.type==='celebration')celebrate()}
function showEvents(events){if(events.length===1){showEvent(events[0]);return}const first=events[0],types=new Set(events.map(e=>e.type));setToastIcon(types.size===1?first.type:'mixed');$('toastTitle').textContent=events.map(e=>e.name).join(' · ');$('toastDate').textContent=viewYear+'년 '+first.solarMonth+'월 '+first.solarDay+'일 · '+events.length+'개의 일정';$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),3600);if(events.some(e=>e.type==='celebration'))celebrate()}
function openModal(){$('modalYear').textContent=viewYear+'년 · 총 '+resolved.length+'개';const root=$('allEventList');root.textContent='';resolved.forEach(e=>{const item=document.createElement('button'),yearText=e.year+'년'+(e.type==='celebration'?'생':'');item.type='button';item.className='all-event '+(e.lunar?'':'solar');item.innerHTML='<div class="all-event-date">'+e.solarMonth+'월 '+e.solarDay+'일<span>'+viewYear+'년</span></div><div class="all-event-info"><strong>'+e.name+'</strong><span>'+(e.lunar?'음력 '+e.month+'월 '+e.day+'일 · ':'')+yearText+'</span></div><span class="badge">'+(e.lunar?'음력':'양력')+'</span>';item.onclick=()=>goToEvent(e);root.append(item)});$('eventModal').classList.add('open');$('eventModal').setAttribute('aria-hidden','false');document.body.style.overflow='hidden';$('modalClose').focus()}
function closeModal(returnFocus=true){$('eventModal').classList.remove('open');$('eventModal').setAttribute('aria-hidden','true');document.body.style.overflow='';if(returnFocus)$('viewAll').focus()}
function goToEvent(e,fromModal=true){viewMonth=e.solarMonth-1;render();if(fromModal)closeModal(false);requestAnimationFrame(()=>{const day=document.querySelector('.day[data-day="'+e.solarDay+'"]');document.querySelector('.calendar').scrollIntoView({behavior:'smooth',block:'start'});if(day){day.classList.add('target');day.focus({preventScroll:true});setTimeout(()=>day.classList.remove('target'),2200)}})}
function setTheme(theme){document.documentElement.dataset.theme=theme;localStorage.setItem('calendar-theme',theme);$('themeToggle').setAttribute('aria-label',theme==='dark'?'라이트 모드로 전환':'다크 모드로 전환');document.querySelector('meta[name="theme-color"]').content=theme==='dark'?'#171816':'#f5efe5'}
function celebrate(){const root=$('confetti');root.textContent='';if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;const colors=['#e76843','#efc95e','#537765','#ef9caf','#79a7c9'];for(let i=0;i<75;i++){const p=document.createElement('i');p.style.left=Math.random()*100+'%';p.style.background=colors[i%colors.length];p.style.setProperty('--duration',2.4+Math.random()*2.5+'s');p.style.setProperty('--drift',-90+Math.random()*180+'px');p.style.animationDelay=Math.random()*.8+'s';root.append(p)}setTimeout(()=>root.textContent='',5600)}
function sameDate(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate()}
function changeMonth(d){viewMonth+=d;if(viewMonth<0){viewMonth=11;setYear(viewYear-1)}else if(viewMonth>11){viewMonth=0;setYear(viewYear+1)}else render()}
$('prevMonth').onclick=()=>changeMonth(-1);$('nextMonth').onclick=()=>changeMonth(1);
$('viewAll').onclick=openModal;$('modalClose').onclick=closeModal;$('eventModal').onclick=e=>{if(e.target===$('eventModal'))closeModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('eventModal').classList.contains('open'))closeModal()});
$('themeToggle').onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');setTheme(document.documentElement.dataset.theme||'light');
setYear(viewYear);
</script>
</body></html>
